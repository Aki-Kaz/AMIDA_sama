<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>あみださま</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: pop sticker-style panels on a dotted lavender ground. Input panels on top, draw button, then an amida ladder stage that plays after the button, then result cards. */
:root {
  --bg: #F3F1FF;
  --dot: #DAD5FF;
  --surface: #FFFFFF;
  --field: #F6F4FF;
  --fg: #1B1B3A;
  --muted: #5E5A8A;
  --edge: #1B1B3A;
  --shadow: #1B1B3A;
  --ink: #1B1B3A;
  --danger: #D81B4A;
  --c0: #FF5FA2;
  --c1: #29C6F2;
  --c2: #FFD93D;
  --c3: #3DDC97;
  --c4: #FF9A3D;
  --c5: #8B6CFF;
  --rest: #D6D3EE;
  --font-display: "Dela Gothic One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17142B; --dot: #26214A; --surface: #231F42; --field: #2D2857; --fg: #F3F1FF; --muted: #B3AEE0;
    --edge: #C9C2FF; --shadow: #0A0816; --danger: #FF7C9E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17142B; --dot: #26214A; --surface: #231F42; --field: #2D2857; --fg: #F3F1FF; --muted: #B3AEE0;
  --edge: #C9C2FF; --shadow: #0A0816; --danger: #FF7C9E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; align-items: center; gap: 16px; }
header svg { flex: none; width: 64px; height: 64px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.1; margin: 0; letter-spacing: 0.04em; text-shadow: 3px 3px 0 var(--c0); text-wrap: balance; }
.lead { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 500; }
.panels { display: grid; grid-template-columns: 1fr; gap: 22px; }
@media (min-width: 760px) { .panels { grid-template-columns: 1fr 1fr; align-items: start; } }
.panel { background: var(--surface); border: 2.5px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { margin: 0; font-size: 1.1rem; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 .meta { font-size: 0.85rem; font-weight: 700; color: var(--ink); background: var(--c2); border-radius: 999px; padding: 1px 12px; font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
.opt { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; background: var(--field); border: 2px solid var(--edge); border-radius: 10px; padding: 10px 12px; }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--c0); flex: none; }
.opt small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }
.stage-block + .stage-block { margin-top: 22px; }
.stage-title { font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.stage-title i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--edge); display: inline-block; }
.card li .dupmark { font-size: 0.72rem; margin-left: 8px; background: var(--c2); color: var(--ink); border: 1.5px solid var(--edge); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
textarea, input[type="text"], input[type="number"] {
  font: inherit; color: var(--fg); background: var(--field);
  border: 2px solid var(--edge); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 220px; resize: vertical; line-height: 1.7; }
:focus-visible { outline: 3px solid var(--c0); outline-offset: 2px; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 96px 40px; gap: 8px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--edge); }
.count-wrap { display: flex; align-items: center; gap: 6px; }
.count-wrap span { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; border-radius: 10px; }
.icon-btn { width: 40px; height: 40px; border: 2px solid var(--edge); background: var(--surface); color: var(--fg); font-size: 1.1rem; line-height: 1; font-weight: 700; }
.icon-btn:hover { background: var(--danger); color: #fff; }
.ghost { align-self: flex-start; border: 2px dashed var(--edge); background: transparent; color: var(--fg); padding: 8px 14px; font-weight: 700; }
.ghost:hover { background: var(--c1); color: var(--ink); border-style: solid; }
.summary { font-size: 0.9rem; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.summary.bad { color: var(--danger); font-weight: 700; }
.dup { border: 2px solid var(--danger); border-radius: 10px; background: var(--field); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }
.dup[hidden] { display: none; }
.dup strong { color: var(--danger); }
.dup p { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.draw {
  border: 3px solid var(--edge); background: var(--c0); color: var(--ink);
  box-shadow: 5px 5px 0 var(--shadow);
  font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.1em;
  padding: 14px 44px; min-width: min(100%, 300px); border-radius: 16px;
  transition: transform 0.08s, box-shadow 0.08s;
}
.draw:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--shadow); }
.draw:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--shadow); }
.draw:disabled { opacity: 0.45; cursor: not-allowed; }
.sub { border: 2px solid var(--edge); background: var(--surface); color: var(--fg); padding: 9px 16px; font-weight: 700; }
.sub:hover { background: var(--c2); color: var(--ink); }
.status { min-height: 1.4em; font-size: 0.9rem; color: var(--muted); font-weight: 500; }
#stagePanel[hidden], #results[hidden] { display: none; }
.stage { overflow-x: auto; padding-bottom: 4px; }
.stage svg { display: block; margin: 0 auto; max-width: none; }
.vline, .rung { stroke: var(--edge); stroke-width: 3; stroke-linecap: round; }
.tname { fill: var(--fg); font-size: 11px; font-weight: 700; text-anchor: middle; font-family: var(--font-body); }
.chip-t { fill: var(--ink); font-size: 11px; font-weight: 700; text-anchor: middle; font-family: var(--font-body); }
.trace { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
.token { stroke: var(--edge); stroke-width: 2.5; fill: var(--surface); }
.faded { opacity: 0.25; transition: opacity 0.5s; }
.chip-r { stroke: var(--edge); stroke-width: 2.5; fill: var(--rest); transition: fill 0.3s; }
h2.res { margin-bottom: 14px; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 2.5px solid var(--edge); border-radius: 16px; box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; min-width: 0; }
.card h3 { margin: 0; padding: 10px 16px; font-size: 1.05rem; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; color: var(--ink); border-bottom: 2.5px solid var(--edge); }
.card h3 .n { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.card ul { list-style: none; margin: 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.card li { background: var(--field); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 14px; font-weight: 700; overflow-wrap: anywhere; }
.card.rolling li { opacity: 0.7; }
.rest { color: var(--muted); font-size: 0.95rem; background: var(--surface); border: 2.5px solid var(--edge); border-radius: 14px; padding: 10px 16px; }
.rest summary { cursor: pointer; font-weight: 700; color: var(--fg); }
.rest p { margin: 8px 0 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: pop 0.45s cubic-bezier(.2,1.5,.4,1) both; }
  .card:nth-child(2) { animation-delay: 0.08s; }
  .card:nth-child(3) { animation-delay: 0.16s; }
  .card:nth-child(n+4) { animation-delay: 0.24s; }
  @keyframes pop { from { transform: scale(0.85) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .rung { animation: draw-in 0.35s ease-out both; }
  @keyframes draw-in { from { opacity: 0; } to { opacity: 1; } }
}
</style>

<div class="wrap">
  <header>
    <svg viewBox="0 0 64 64" fill="none" stroke-width="4.5" stroke-linecap="round" aria-hidden="true">
      <path d="M12 6v52" stroke="#FF5FA2"/><path d="M32 6v52" stroke="#29C6F2"/><path d="M52 6v52" stroke="#FFD93D"/>
      <path d="M12 20h20M32 34h20M12 46h20" stroke="currentColor" style="color:var(--edge)"/>
    </svg>
    <div>
      <h1>あみださま</h1>
      <p class="lead">簡単に複雑なあみだくじができるサイト</p>
    </div>
  </header>

  <div class="panels">
    <section class="panel" aria-labelledby="h-people">
      <h2 id="h-people">候補者 <span class="meta" id="peopleCount">0人</span></h2>
      <p class="hint">1行につき1人として数えます。空の行は数えません。最初は例が入っています。</p>
      <label for="people" hidden>候補者の一覧</label>
      <textarea id="people" spellcheck="false" placeholder="田中&#10;佐藤&#10;鈴木"></textarea>
      <div class="dup" id="dupBox" hidden>
        <p><strong>同じ名前の行があります。</strong><span id="dupList"></span></p>
        <button type="button" class="sub" id="dedupe">重複を1つにまとめる</button>
      </div>
      <div class="actions"><button type="button" class="sub" id="clearPeople">候補者を空にする</button></div>
    </section>

    <section class="panel" aria-labelledby="h-groups">
      <h2 id="h-groups">当たり枠<span class="meta" id="groupTotal"></span></h2>
      <p class="hint">枠のタイトルと人数を変更して下さい。</p>
      <label class="opt" for="overlap"><input type="checkbox" id="overlap"><span>当たり枠の重複を許す<small>オフ: 1人は1つの枠だけ。オン: 枠ごとに候補者全員から別々に選びます。</small></span></label>
      <div class="rows" id="rows"></div>
      <button type="button" class="ghost" id="addRow">＋ 枠を追加</button>
      <div class="summary" id="summary" role="status"></div>
    </section>
  </div>

  <div class="actions">
    <button type="button" class="draw" id="draw">選ぶ</button>
    <button type="button" class="sub" id="skip" hidden>演出をとばす</button>
    <span class="status" id="status" role="status"></span>
  </div>

  <section class="panel" id="stagePanel" hidden aria-label="あみだくじの演出">
    <div class="stage" id="stage"></div>
  </section>

  <section id="results" hidden aria-labelledby="h-results">
    <h2 class="res" id="h-results">けっか</h2>
    <div class="cards" id="cards" aria-live="polite"></div>
    <div class="actions" style="margin-top:18px">
      <button type="button" class="sub" id="copy">結果をコピー</button>
    </div>
    <details class="rest" id="restBox" style="margin-top:16px">
      <summary id="restTitle"></summary>
      <p id="restList"></p>
    </details>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var peopleEl = $("people"), rowsEl = $("rows"), drawBtn = $("draw"), skipBtn = $("skip");
  var NS = "http://www.w3.org/2000/svg";
  var rowSeq = 0, last = null, busy = false, skipNow = false, timer = null;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  function gcol(i) { return "var(--c" + (i % 6) + ")"; }
  function trunc(s, n) { var a = Array.from(s); return a.length > n ? a.slice(0, n - 1).join("") + "…" : s; }

  function parsePeople() {
    return peopleEl.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
  }
  function findDups(people) {
    var m = {}, order = [];
    people.forEach(function (p) { if (m[p] === undefined) { m[p] = 0; order.push(p); } m[p] += 1; });
    return order.filter(function (p) { return m[p] > 1; }).map(function (p) { return { name: p, n: m[p] }; });
  }

  function addRow(title, count) {
    rowSeq += 1;
    var row = document.createElement("div");
    row.className = "row";
    var d = document.createElement("span"); d.className = "dot";
    var t = document.createElement("input");
    t.type = "text"; t.id = "g-title-" + rowSeq; t.value = title || ""; t.placeholder = "タイトル(例: 赤チーム)";
    t.setAttribute("aria-label", "枠のタイトル");
    var cw = document.createElement("div"); cw.className = "count-wrap";
    var c = document.createElement("input");
    c.type = "number"; c.id = "g-count-" + rowSeq; c.min = "1"; c.step = "1"; c.inputMode = "numeric";
    c.value = String(count || 1);
    c.setAttribute("aria-label", "選ぶ人数");
    var u = document.createElement("span"); u.textContent = "人";
    cw.appendChild(c); cw.appendChild(u);
    var x = document.createElement("button");
    x.type = "button"; x.className = "icon-btn"; x.textContent = "×"; x.setAttribute("aria-label", "この枠を削除");
    x.addEventListener("click", function () {
      if (rowsEl.children.length > 1) { row.remove(); refresh(); }
    });
    row.appendChild(d); row.appendChild(t); row.appendChild(cw); row.appendChild(x);
    rowsEl.appendChild(row);
    t.addEventListener("input", refresh);
    c.addEventListener("input", refresh);
  }

  function readGroups() {
    var out = [];
    Array.prototype.forEach.call(rowsEl.children, function (row, i) {
      var title = row.querySelector("input[type=text]").value.trim();
      var n = parseInt(row.querySelector("input[type=number]").value, 10);
      out.push({ title: title || ("枠" + (i + 1)), count: isFinite(n) ? n : 0 });
    });
    return out;
  }

  function refresh() {
    var people = parsePeople();
    var groups = readGroups();
    Array.prototype.forEach.call(rowsEl.children, function (row, i) { row.querySelector(".dot").style.background = gcol(i); });
    var total = groups.reduce(function (a, g) { return a + (g.count > 0 ? g.count : 0); }, 0);
    var invalid = groups.some(function (g) { return g.count < 1; });
    var dups = findDups(people);
    $("peopleCount").textContent = people.length + "人";
    $("groupTotal").textContent = "合計 " + total + "人";
    $("dupBox").hidden = dups.length === 0;
    if (dups.length) {
      $("dupList").textContent = " " + dups.map(function (d) { return "「" + d.name + "」(" + d.n + "行)"; }).join("、");
    }
    var s = $("summary");
    var msg = "", bad = false;
    if (people.length === 0) { msg = "候補者を入力してください。"; bad = true; }
    else if (dups.length) { msg = "同じ名前の行があるため選べません。重複を直してください。"; bad = true; }
    else if (invalid) { msg = "人数は1以上の整数にしてください。"; bad = true; }
    else if ($("overlap").checked && groups.some(function (g) { return g.count > people.length; })) { msg = "1つの枠の人数が候補者(" + people.length + "人)を超えています。"; bad = true; }
    else if (!$("overlap").checked && total > people.length) { msg = "選ぶ人数の合計(" + total + "人)が候補者(" + people.length + "人)を超えています。"; bad = true; }
    else if ($("overlap").checked) { msg = "候補者" + people.length + "人から、枠ごとに別々に選びます。同じ人が複数の枠に入ることがあります。"; }
    else { msg = "候補者" + people.length + "人のうち" + total + "人を選び、" + (people.length - total) + "人が残ります。"; }
    s.textContent = msg;
    s.className = "summary" + (bad ? " bad" : "");
    drawBtn.disabled = bad || busy;
  }

  function randInt(n) {
    var limit = Math.floor(4294967296 / n) * n;
    var buf = new Uint32Array(1), v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
    return v % n;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = randInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildCards(results, rolling) {
    var cards = $("cards");
    cards.textContent = "";
    var cnt = {};
    results.forEach(function (r) { r.names.forEach(function (nm) { cnt[nm] = (cnt[nm] || 0) + 1; }); });
    results.forEach(function (r, gi) {
      var card = document.createElement("div");
      card.className = "card" + (rolling ? " rolling" : "");
      var h = document.createElement("h3");
      h.style.background = gcol(gi);
      var name = document.createElement("span"); name.textContent = r.title;
      var n = document.createElement("span"); n.className = "n"; n.textContent = r.count + "人";
      h.appendChild(name); h.appendChild(n);
      var ul = document.createElement("ul");
      r.names.forEach(function (nm) {
        var li = document.createElement("li"); li.textContent = nm;
        if (!rolling && cnt[nm] > 1) {
          var mk = document.createElement("span"); mk.className = "dupmark"; mk.textContent = "重複 " + cnt[nm] + "枠";
          li.appendChild(mk);
        }
        ul.appendChild(li);
      });
      card.appendChild(h); card.appendChild(ul);
      cards.appendChild(card);
    });
  }

  function svgEl(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    if (parent) parent.appendChild(e);
    return e;
  }

  /* Ladder whose real routes lead every person to the slot decided by the shuffle. */
  function runAmida(stage, people, pool, groups, off, onDone) {
    var n = people.length;
    var colW = 56, padX = 10, LV = 34, yTop = 40;
    var slotGroup = [];
    groups.forEach(function (g, gi) { for (var c = 0; c < g.count; c++) slotGroup.push(gi); });
    while (slotGroup.length < n) slotGroup.push(-1);

    var targetPos = new Array(n);
    pool.forEach(function (p, k) { targetPos[p] = k; });

    var arr = [], i, rungsSeq = [];
    for (i = 0; i < n; i++) arr.push(i);
    var decoys = Math.max(n * 2, 6);
    for (i = 0; i < decoys; i++) {
      var d = randInt(n - 1), t = arr[d]; arr[d] = arr[d + 1]; arr[d + 1] = t; rungsSeq.push(d);
    }
    for (;;) {
      var inv = [];
      for (i = 0; i < n - 1; i++) if (targetPos[arr[i]] > targetPos[arr[i + 1]]) inv.push(i);
      if (!inv.length) break;
      var pick = inv[randInt(inv.length)], tt = arr[pick]; arr[pick] = arr[pick + 1]; arr[pick + 1] = tt; rungsSeq.push(pick);
    }
    var lastLv = []; for (i = 0; i < n; i++) lastLv.push(-1);
    var rungs = [], L = 0;
    rungsSeq.forEach(function (c) {
      var l = Math.max(lastLv[c], lastLv[c + 1]) + 1;
      lastLv[c] = lastLv[c + 1] = l; rungs.push({ c: c, l: l }); if (l + 1 > L) L = l + 1;
    });

    var W = n * colW + padX * 2;
    var yEnd = yTop + LV * (L + 1);
    var H = yEnd + 74;
    function X(c) { return padX + c * colW + colW / 2; }
    function Y(l) { return yTop + LV * (l + 1); }

    stage.textContent = "";
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", "aria-label": "あみだくじ" }, stage);
    var c;
    for (c = 0; c < n; c++) svgEl("line", { "class": "vline", x1: X(c), y1: yTop, x2: X(c), y2: yEnd }, svg);
    var introMs = Math.min(1100, L * 45 + 250);
    rungs.forEach(function (r) {
      var ln = svgEl("line", { "class": "rung", x1: X(r.c), y1: Y(r.l), x2: X(r.c + 1), y2: Y(r.l) }, svg);
      ln.style.animationDelay = (r.l * 45) + "ms";
    });
    for (c = 0; c < n; c++) {
      var tx = svgEl("text", { "class": "tname", x: X(c), y: yTop - 22 }, svg);
      tx.textContent = trunc(people[c], 4);
    }

    var at = []; for (i = 0; i < n; i++) at.push(i);
    var paths = []; for (i = 0; i < n; i++) paths.push([]);
    var byLevel = []; for (i = 0; i < L; i++) byLevel.push([]);
    rungs.forEach(function (r) { byLevel[r.l].push(r.c); });
    byLevel.forEach(function (cols, l) {
      cols.forEach(function (col) {
        var a = at[col], b = at[col + 1];
        paths[a].push({ y: Y(l), x0: X(col), x1: X(col + 1) });
        paths[b].push({ y: Y(l), x0: X(col + 1), x1: X(col) });
        at[col] = b; at[col + 1] = a;
      });
    });

    var traces = [], tokens = [];
    for (i = 0; i < n; i++) {
      traces.push(svgEl("polyline", { "class": "trace", stroke: gcol(i), points: X(i) + "," + yTop }, svg));
    }
    for (i = 0; i < n; i++) {
      tokens.push(svgEl("circle", { "class": "token", r: 9, cx: X(i), cy: yTop }, svg));
    }
    var chips = [];
    for (c = 0; c < n; c++) {
      var rect = svgEl("rect", { "class": "chip-r", x: X(c) - 24, y: yEnd + 10, width: 48, height: 26, rx: 13 }, svg);
      var ct = svgEl("text", { "class": "chip-t", x: X(c), y: yEnd + 28 }, svg);
      ct.textContent = "？";
      var nm = svgEl("text", { "class": "tname", x: X(c), y: yEnd + 56 }, svg);
      chips.push({ rect: rect, t: ct, name: nm });
    }

    function smooth(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
    var HW = 7;
    function frame(p, y) {
      var x = X(p), pts = [X(p) + "," + yTop], list = paths[p], k;
      for (k = 0; k < list.length; k++) {
        var cr = list[k];
        if (y <= cr.y - HW) break;
        pts.push(cr.x0 + "," + (cr.y - HW));
        if (y >= cr.y + HW) { x = cr.x1; pts.push(cr.x1 + "," + (cr.y + HW)); continue; }
        x = cr.x0 + (cr.x1 - cr.x0) * smooth((y - (cr.y - HW)) / (HW * 2));
        break;
      }
      pts.push(x + "," + y);
      traces[p].setAttribute("points", pts.join(" "));
      tokens[p].setAttribute("cx", x);
      tokens[p].setAttribute("cy", y);
    }

    function reveal() {
      for (var k = 0; k < n; k++) {
        var gi = slotGroup[k], who = pool[k];
        chips[k].rect.style.fill = gi >= 0 ? gcol(gi + off) : "var(--rest)";
        chips[k].t.textContent = gi >= 0 ? trunc(groups[gi].title, 4) : "—";
        chips[k].name.textContent = trunc(people[who], 4);
        if (gi >= 0) { tokens[who].style.fill = gcol(gi + off); }
        else { tokens[who].setAttribute("class", "token faded"); traces[who].setAttribute("class", "trace faded"); }
      }
    }

    var dur = 3600 + L * 60;
    var started = null, intro = reduce.matches ? 0 : introMs;
    function finish() { frame0(); reveal(); onDone(); }
    function frame0() { for (var q = 0; q < n; q++) frame(q, yEnd); }
    function step(now) {
      if (skipNow) { finish(); return; }
      if (started === null) started = now;
      var el = now - started - intro;
      if (el < 0) { requestAnimationFrame(step); return; }
      var u = Math.min(1, el / dur);
      var e = 0.5 - Math.cos(Math.PI * u) / 2;
      var y = yTop + (yEnd - yTop) * e;
      for (var q = 0; q < n; q++) frame(q, y);
      if (u < 1) requestAnimationFrame(step); else setTimeout(finish, 250);
    }
    requestAnimationFrame(step);
  }

  function draw() {
    var people = parsePeople();
    var groups = readGroups();
    var overlap = $("overlap").checked;
    var idx = []; people.forEach(function (_, k) { idx.push(k); });
    var pools, results, rest;
    if (overlap) {
      pools = groups.map(function () { return shuffle(idx.slice()); });
      results = groups.map(function (g, gi) {
        return { title: g.title, count: g.count, names: pools[gi].slice(0, g.count).map(function (k) { return people[k]; }) };
      });
      var any = {};
      pools.forEach(function (p, gi) { p.slice(0, groups[gi].count).forEach(function (k) { any[k] = true; }); });
      rest = people.filter(function (_, k) { return !any[k]; });
    } else {
      var pool = shuffle(idx.slice());
      var i = 0;
      pools = [pool];
      results = groups.map(function (g) {
        var names = pool.slice(i, i + g.count).map(function (k) { return people[k]; }); i += g.count;
        return { title: g.title, count: g.count, names: names };
      });
      rest = pool.slice(i).map(function (k) { return people[k]; });
    }
    last = { results: results, rest: rest };

    busy = true; skipNow = false;
    drawBtn.disabled = true;
    $("results").hidden = true;
    var done = function () {
      busy = false;
      skipBtn.hidden = true;
      $("status").textContent = "";
      buildCards(results, false);
      $("restTitle").textContent = (overlap ? "どの枠にも選ばれなかった人(" : "選ばれなかった人(") + rest.length + "人)";
      $("restList").textContent = rest.length ? rest.join("、") : "なし";
      $("results").hidden = false;
      drawBtn.textContent = "もう一度選ぶ";
      refresh();
      $("results").scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "nearest" });
    };

    if (reduce.matches) { $("stagePanel").hidden = true; done(); return; }

    skipBtn.hidden = false;
    $("status").textContent = "あみだくじを引いています…";
    if (people.length >= 2 && people.length <= 30) {
      $("stagePanel").hidden = false;
      $("stagePanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
      var stageEl = $("stage");
      stageEl.textContent = "";
      var left = overlap ? groups.length : 1;
      var oneDone = function () { left -= 1; if (left === 0) done(); };
      if (overlap) {
        groups.forEach(function (g, gi) {
          var blk = document.createElement("div"); blk.className = "stage-block";
          var ttl = document.createElement("p"); ttl.className = "stage-title";
          var dt = document.createElement("i"); dt.style.background = gcol(gi);
          var tx = document.createElement("span"); tx.textContent = g.title + "(" + g.count + "人)";
          ttl.appendChild(dt); ttl.appendChild(tx);
          var box = document.createElement("div"); box.className = "stage";
          blk.appendChild(ttl); blk.appendChild(box); stageEl.appendChild(blk);
          runAmida(box, people, pools[gi], [g], gi, oneDone);
        });
      } else {
        runAmida(stageEl, people, pools[0], groups, 0, oneDone);
      }
    } else {
      $("stagePanel").hidden = true;
      $("results").hidden = false;
      var ticks = 0;
      if (timer) clearInterval(timer);
      timer = setInterval(function () {
        ticks += 1;
        var fake = results.map(function (r) {
          return { title: r.title, count: r.count, names: r.names.map(function () { return people[randInt(people.length)]; }) };
        });
        buildCards(fake, true);
        if (ticks >= 14 || skipNow) { clearInterval(timer); timer = null; done(); }
      }, 70);
    }
  }

  function copyResult() {
    if (!last) return;
    var text = last.results.map(function (r) {
      return r.title + "(" + r.count + "人): " + r.names.join("、");
    }).join("\n");
    var done = function (ok) { $("status").textContent = ok ? "結果をコピーしました。" : "コピーできませんでした。結果の文字を選んでコピーしてください。"; };
    try {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } catch (e) { done(false); }
  }

  peopleEl.addEventListener("input", refresh);
  $("overlap").addEventListener("change", refresh);
  $("clearPeople").addEventListener("click", function () { peopleEl.value = ""; refresh(); peopleEl.focus(); });
  $("dedupe").addEventListener("click", function () {
    var seen = {}, out = [];
    peopleEl.value.split(/\r?\n/).forEach(function (line) {
      var s = line.trim();
      if (!s || seen[s]) return;
      seen[s] = true; out.push(s);
    });
    peopleEl.value = out.join("\n");
    refresh();
  });
  $("addRow").addEventListener("click", function () { addRow("", 1); refresh(); });
  drawBtn.addEventListener("click", draw);
  skipBtn.addEventListener("click", function () { skipNow = true; });
  $("copy").addEventListener("click", copyResult);

  peopleEl.value = ["田中", "佐藤", "鈴木", "高橋", "伊藤"].join("\n");
  addRow("赤チーム", 2);
  addRow("青チーム", 2);
  refresh();
})();
</script>

</body></html>
